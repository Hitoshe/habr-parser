<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habr ➜ Markdown Night Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7f5af0;
            --primary-hover: #9471f6;
            --bg: #16161a;
            --card-bg: #1f1f23;
            --text: #fffffe;
            --sub-text: #94a1b2;
            --accent: #2cb67d;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Анимированные звезды на фоне */
        .stars-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
            z-index: 10;
            border: 1px solid #2d2d3a;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-weight: 600;
            margin-bottom: 2rem;
            letter-spacing: -1px;
            background: linear-gradient(to right, #7f5af0, #2cb67d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--sub-text);
            font-size: 0.85rem;
            font-weight: 400;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #242429;
            border: 2px solid #2d2d3a;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(127, 90, 240, 0.3);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(127, 90, 240, 0.4);
        }

        button:active { transform: translateY(0); }

        #status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--accent);
            min-height: 1.2rem;
        }

        /* Мини лоадер */
        .loading-dots:after {
            content: ' .';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            40% { color: white; text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            60% { text-shadow: .25em 0 0 white, .5em 0 0 rgba(0,0,0,0); }
            80%, 100% { text-shadow: .25em 0 0 white, .5em 0 0 white; }
        }
    </style>
</head>
<body>

<div class="stars-container" id="starfield"></div>

<div class="card">
    <h1>Habr ➜ Markdown</h1>

    <div class="input-group">
        <label>Ссылка на статью</label>
        <input type="text" id="urlInput" placeholder="https://habr.com/ru/...">
    </div>

    <div class="input-group">
        <label>Лимит комментариев (0 = выключить)</label>
        <input type="number" id="commentLimit" value="10" min="0" max="500">
    </div>

    <button id="mainBtn" onclick="process()">Конвертировать</button>

    <div id="status"></div>
</div>

<script>
    // Создаем звезды программно
    const starfield = document.getElementById('starfield');
    for (let i = 0; i < 150; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 'px';
        star.style.width = size;
        star.style.height = size;
        star.style.top = Math.random() * 100 + '%';
        star.style.left = Math.random() * 100 + '%';
        star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
        starfield.appendChild(star);
    }

    async function process() {
        const url = document.getElementById('urlInput').value;
        const limit = document.getElementById('commentLimit').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('mainBtn');

        if (!url) return alert("Введите ссылку!");

        btn.disabled = true;
        status.className = "loading-dots";
        status.innerText = "Магия парсинга в процессе";

        try {
            // 1. Отправляем запрос на бэкенд
            const response = await fetch(`/api/parser/download?url=${encodeURIComponent(url)}&commentLimit=${limit}`, {
                method: 'POST'
            });

            if (!response.ok) throw new Error("Ошибка сервера");

            // 2. Получаем файл как Blob
            const blob = await response.blob();

            // 3. Скачиваем его
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = "article.md";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            status.className = "";
            status.innerText = "✨ Статья успешно скачана!";
        } catch (err) {
            status.className = "";
            status.style.color = "#ff5f5f";
            status.innerText = "❌ Ошибка. Проверьте ссылку.";
        } finally {
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
